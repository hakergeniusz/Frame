<?xml version="1.0" encoding="UTF-8"?>
<!--
  Frame original icon (MIT, part of Frame's own artwork):
  the letters "a b" under a loop-back arrow — the A-B loop glyph.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <g fill="currentColor">
    <!-- loop-back arrow -->
    <path d="M 4 4.6 A 4.2 4.2 0 0 1 12 4.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 12.9 2.9 L 12.9 5.9 L 10.2 4.4 Z"/>
    <!-- letter a: bowl + stem -->
    <path d="M 4.7 7.4 a 2.1 2.1 0 1 0 1.5 3.6 v 1 h 1.4 V 10.4 A 3.1 3.1 0 0 0 4.7 7.4 Z m 0.5 2.7 a 1.3 1.3 0 1 1 1.3 1.3 1.3 1.3 0 0 1 -1.3 -1.3 Z" fill-rule="evenodd"/>
    <rect x="7.6" y="7.6" width="1.4" height="4.4" rx="0.7"/>
    <!-- letter b: stem + bowl -->
    <rect x="10.5" y="5.8" width="1.4" height="6.2" rx="0.7"/>
    <path d="M 11.2 7.4 a 2.1 2.1 0 1 0 2.1 2.1 2.1 2.1 0 0 0 -2.1 -2.1 Z m 0.5 1.2 a 1.3 1.3 0 1 1 -1.3 1.3 1.3 1.3 0 0 1 1.3 -1.3 Z" fill-rule="evenodd"/>
  </g>
</svg>
