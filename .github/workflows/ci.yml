name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    # libadwaita-sys requires libadwaita >= 1.6; ubuntu-24.04 (ubuntu-latest)
    # ships 1.5.0. The Arch container carries a current GTK4/libadwaita stack
    # — the same environment packaging/arch/build.sh is proven in.
    container:
      image: archlinux:latest
    name: test (${{ matrix.arch }})
    steps:
      - name: Install git (actions/checkout needs it inside the container)
        run: pacman -Syu --noconfirm git
      - uses: actions/checkout@v4
      - name: Install toolchain and libraries
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel rust gtk4 libadwaita mpv desktop-file-utils appstream
      - name: Build
        run: cargo build --release --locked
      - name: Run tests
        run: cargo test --release --locked
      - name: Validate desktop + AppStream metadata
        run: |
          desktop-file-validate assets/io.github.hakergeniusz.Frame.desktop
          appstreamcli validate --no-net assets/io.github.hakergeniusz.Frame.metainfo.xml
