name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    # The test job builds inside a container because the tests need current
    # GTK4/libadwaita (libadwaita-sys requires >= 1.6; ubuntu-24.04 ships
    # 1.5.0) and the Arch image is x86_64-only (no linux/arm64 manifest).
    # Fedora is multi-arch and carries current GNOME libraries on both
    # architectures — the same base as packaging/fedora.
    container:
      image: fedora:latest
    name: test (${{ matrix.arch }})
    steps:
      - name: Install git (actions/checkout needs it inside the container)
        run: dnf install -y git
      - uses: actions/checkout@v4
      - name: Install toolchain and libraries
        run: |
          dnf install -y rust cargo gtk4-devel libadwaita-devel mpv-devel \
            pkgconf-pkg-config desktop-file-utils appstream
      - name: Build
        run: cargo build --release --locked
      - name: Run tests
        run: cargo test --release --locked
      - name: Validate desktop + AppStream metadata
        run: |
          desktop-file-validate assets/io.github.hakergeniusz.Frame.desktop
          appstreamcli validate --no-net assets/io.github.hakergeniusz.Frame.metainfo.xml
