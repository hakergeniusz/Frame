name: Packages

# Builds distributable packages for both architectures:
#   - Debian .deb        (amd64 native, arm64 cross-compiled)
#   - Fedora .rpm        (x86_64 native, aarch64 cross-compiled)
#   - Arch PKGBUILD      (x86_64 native, aarch64 cross-compiled)
#   - Flatpak            (x86_64; arm64 built by the same steps on arm runners)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  deb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    name: deb (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb in Debian container
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:trixie bash packaging/debian/build.sh
      - name: Smoke-test package install
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:trixie bash -c '
            apt-get update -qq &&
            apt-get install -y ./dist/frame_*_${{ matrix.arch }}.deb &&
            frame --version 2>/dev/null || dpkg -L frame'
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb

  rpm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    name: rpm (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v4
      - name: Build .rpm in Fedora container
        run: |
          docker run --rm -v "$PWD:/src" -w /src fedora:latest bash packaging/fedora/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: dist/*.rpm

  arch:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            cmd: docker run --rm -v "$PWD:/src" -w /src archlinux:latest bash packaging/arch/build.sh
          - os: ubuntu-24.04-arm
            arch: aarch64
            # No official Arch container image exists for arm64 (Docker
            # Hub's archlinux org is x86_64-only and there is no
            # archlinuxarm org). Chroot into Arch Linux ARM's official
            # rootfs instead — the runner is aarch64, so everything runs
            # natively, no emulation involved.
            cmd: bash packaging/arch/build-arm64.sh
    runs-on: ${{ matrix.os }}
    name: arch (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the ALARM chroot build
        if: matrix.arch == 'aarch64'
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL /opt/ghc \
            /usr/local/.ghcup /usr/share/dotnet /usr/local/share/boost /usr/lib/jvm || true
          df -h
      - name: Build pacman package
        run: ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: arch-${{ matrix.arch }}
          # The extension follows the build host's makepkg.conf: upstream
          # Arch defaults to .pkg.tar.zst, ALARM hardcodes .pkg.tar.xz.
          path: '**/*.pkg.tar.*'

  flatpak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    name: flatpak (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak
        run: sudo apt-get install -y flatpak flatpak-builder
      - name: Set up Flathub
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Install runtime + rust extension
        run: |
          flatpak install --user --noninteractive flathub \
            org.gnome.Platform//49 org.gnome.Sdk//49 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08
      - name: Build bundle
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean \
            --repo=repo --arch=${{ matrix.arch }} dist \
            packaging/flatpak/io.github.hakergeniusz.Frame.yml
          flatpak build-bundle repo \
            frame-1.0.0-${{ matrix.arch }}.flatpak io.github.hakergeniusz.Frame
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: '*.flatpak'
